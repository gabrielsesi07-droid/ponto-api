name: Verify HoraCerta
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-fund
      - run: npm run verify
      - name: Check critical production advisories
        run: npm audit --omit=dev --audit-level=critical
  postgres-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: horacerta_ci_only
          POSTGRES_DB: horacerta_qa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d horacerta_qa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:horacerta_ci_only@127.0.0.1:5432/horacerta_qa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-fund
      - name: Exercise real PostgreSQL concurrency
        run: npm run test:security-db
